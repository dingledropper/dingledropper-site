<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SusDetector — Play Store Feature Graphic</title>
<style>
  /* Google Play Store feature graphic spec: 1024x500 */
  html, body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --bg: #A0C8E0;
    --surface: #EADAE8;
    --surface-elevated: #DCC4DA;
    --text-primary: #0A1020;
    --text-tertiary: #3A4A6A;
    --outline: #0A1020;
    --accent: #1A5A9A;
  }

  .card {
    width: 1024px;
    height: 500px;
    background: var(--bg);
    padding: 50px 70px 40px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .glow {
    position: absolute;
    top: 35%;
    left: 90px;
    transform: translateY(-50%);
    width: 340px;
    height: 340px;
    background: radial-gradient(circle, rgba(68, 136, 204, 0.55), rgba(68, 136, 204, 0) 70%);
    z-index: 0;
    pointer-events: none;
  }

  .main-row {
    display: flex;
    align-items: center;
    gap: 42px;
    position: relative;
    z-index: 1;
  }

  .icon-wrap {
    width: 190px;
    height: 190px;
    background: var(--surface-elevated);
    border: 4px solid var(--outline);
    border-radius: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    flex-shrink: 0;
    box-shadow: 8px 8px 0 0 var(--outline);
  }

  .text {
    flex: 1;
  }

  .brand-tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: var(--surface-elevated);
    color: var(--text-primary);
    padding: 7px 13px;
    border: 2.5px solid var(--outline);
    box-shadow: 4px 4px 0 0 var(--outline);
    margin-bottom: 16px;
  }

  .app-name {
    font-size: 88px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 0.88;
    color: var(--text-primary);
    margin-bottom: 14px;
  }

  .tagline {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
    max-width: 540px;
  }

  .chips {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
    margin-top: 20px;
  }

  .chip {
    display: inline-block;
    background: var(--surface);
    border: 2.5px solid var(--outline);
    border-radius: 100px;
    padding: 7px 15px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-primary);
    box-shadow: 3px 3px 0 0 var(--outline);
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>

  <div class="main-row">
    <div class="icon-wrap">🛡️</div>
    <div class="text">
      <div class="brand-tag">DINGLEDROPPER LABS</div>
      <div class="app-name">SusDetector</div>
      <div class="tagline">find out what your apps are up to.<br>zero data leaves your phone.</div>
    </div>
  </div>

  <div class="chips">
    <span class="chip">Permission scanner</span>
    <span class="chip">Device audit</span>
    <span class="chip">Tracker radar</span>
    <span class="chip">DNS monitor</span>
    <span class="chip">Stingray detection</span>
    <span class="chip">No root required</span>
  </div>
</div>
</body>
</html>
