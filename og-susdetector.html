<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SusDetector — OG share card</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --bg: #A0C8E0;
    --surface: #EADAE8;
    --surface-elevated: #DCC4DA;
    --text-primary: #0A1020;
    --text-tertiary: #3A4A6A;
    --outline: #0A1020;
    --accent: #1A5A9A;
    --glow: #4488CC;
    --low-bg: #C8F0D8;
    --low-text: #117733;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    padding: 70px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top — brand tag */
  .brand-tag {
    display: inline-block;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    background: var(--surface-elevated);
    padding: 12px 20px;
    border: 3px solid var(--outline);
    box-shadow: 5px 5px 0 0 var(--outline);
    color: var(--text-primary);
    align-self: flex-start;
  }

  /* Middle — hero */
  .hero {
    display: flex;
    align-items: center;
    gap: 50px;
    margin-top: -30px;
  }

  .app-icon {
    width: 180px;
    height: 180px;
    background: var(--surface-elevated);
    border: 4px solid var(--outline);
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    flex-shrink: 0;
    box-shadow: 8px 8px 0 0 var(--outline), 0 0 60px rgba(68, 136, 204, 0.55);
  }

  .hero-text {
    flex: 1;
  }

  .app-name {
    font-size: 108px;
    font-weight: 900;
    letter-spacing: -4px;
    line-height: 0.9;
    color: var(--text-primary);
    margin-bottom: 14px;
  }

  .app-sub {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }

  .tagline {
    font-size: 30px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
    max-width: 780px;
  }

  /* Bottom row */
  .bottom-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--low-bg);
    color: var(--low-text);
    border: 3px solid var(--low-text);
    border-radius: 100px;
    padding: 12px 22px;
    font-size: 18px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 5px 5px 0 0 var(--outline);
  }

  .status::before {
    content: "●";
    font-size: 16px;
  }

  .footer-row {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .publisher {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .url {
    font-size: 22px;
    font-weight: 800;
    color: #FFFFFF;
    background: var(--accent);
    padding: 14px 22px;
    border: 3px solid var(--outline);
    border-radius: 14px;
    box-shadow: 5px 5px 0 0 var(--outline);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="card">

  <div class="brand-tag">DINGLEDROPPER LABS</div>

  <div class="hero">
    <div class="app-icon">🛡️</div>
    <div class="hero-text">
      <div class="app-name">SusDetector</div>
      <div class="app-sub">Android · Privacy Audit</div>
      <div class="tagline">scans every app, every permission,<br>every nearby signal. zero data leaves your phone.</div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="status">Live on Google Play</div>
    <div class="footer-row">
      <div class="publisher">by dingledropper LABS</div>
      <div class="url">dingledropper.com</div>
    </div>
  </div>

</div>
</body>
</html>
